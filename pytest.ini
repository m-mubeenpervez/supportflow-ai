
[pytest]
testpaths = backend/tests
pythonpath = backend
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

#testpaths: Pytest ko batata hai tests kahan hain.
#pythonpath: Backend ka app package import karne deta hai.
#asyncio_mode: Async tests handle karta hai.
#asyncio_default_fixture_loop_scope: Deprecation warning resolve karta hai.
